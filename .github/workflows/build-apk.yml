name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick Android SDK tools
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          PL=$(ls "$ANDROID_HOME/platforms" | grep -E '^android-[0-9]+$' | sort -V | tail -1)
          echo "BT=$ANDROID_HOME/build-tools/$BT" >> $GITHUB_ENV
          echo "JAR=$ANDROID_HOME/platforms/$PL/android.jar" >> $GITHUB_ENV
          echo "Using build-tools $BT and $PL"

      - name: Build
        run: |
          set -e
          VC=${{ github.run_number }}
          rm -rf build && mkdir -p build/res/mipmap build/assets build/classes build/dex
          cp index.html build/assets/index.html
          cp android/icon.png build/res/mipmap/ic_launcher.png
          "$BT/aapt2" compile --dir build/res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$JAR" \
            --manifest android/AndroidManifest.xml -R build/res.zip -A build/assets \
            --min-sdk-version 24 --target-sdk-version 34 \
            --version-code "$VC" --version-name "1.0.$VC"
          javac -source 8 -target 8 -encoding UTF-8 -classpath "$JAR" -d build/classes android/MainActivity.java
          "$BT/d8" --release --min-api 24 --lib "$JAR" --output build/dex $(find build/classes -name '*.class')
          (cd build/dex && zip -q ../base.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/base.apk build/aligned.apk
          KS=android/kharcha.keystore
          if [ ! -f "$KS" ]; then
            echo "No signing key in the repo; making a temporary one"
            KS=build/kharcha.keystore
            keytool -genkeypair -keystore "$KS" -storepass kharcha-app -keypass kharcha-app \
              -alias kharcha -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kharcha"
          fi
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:kharcha-app \
            --key-pass pass:kharcha-app --ks-key-alias kharcha --out Kharcha.apk build/aligned.apk
          "$BT/apksigner" verify Kharcha.apk
          ls -la Kharcha.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk -y --cleanup-tag || true
          gh release create apk Kharcha.apk --title "Kharcha app (build ${{ github.run_number }})" \
            --notes "Download Kharcha.apk below and open it on your Android phone to install. Your entries stay on the phone." --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Kharcha-apk
          path: Kharcha.apk
